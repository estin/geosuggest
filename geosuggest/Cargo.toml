[package]
name = "geosuggest"
version.workspace = true
authors.workspace = true
description = "HTTP service to suggest cities by name or find nearest by coordinates"
readme = "README.md"
keywords = ["geocoding", "service"]
repository = "https://github.com/estin/geosuggest.git"
documentation = "https://docs.rs/geosuggest/"
categories = ["web-programming::http-server"]
license = "MIT"
edition = "2021"

default-run = "geosuggest"

[[bin]]
name = "geosuggest"
path = "src/main.rs"
required-features = ["tokio"]

[features]
default = ["tokio", "geoip2", "tracing"]
demo = [
    "dep:geosuggest-demo",
    "swagger",
    "topcoat/asset",
    "topcoat/fs",
    "topcoat/runtime",
]
geoip2 = ["geosuggest-core/geoip2"]
swagger = ["dep:oaph", "geosuggest-core/oaph"]
tokio = ["dep:tokio"]
tracing = ["dep:tracing", "dep:tracing-subscriber", "geosuggest-core/tracing", "bonfig/tracing"]

[dependencies]
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
serde.workspace = true
topcoat.workspace = true
bonfig.workspace = true

geosuggest-core = { path = "../geosuggest-core", version = "0.9" }
geosuggest-demo = { path = "../geosuggest-demo", version = "0.9", optional = true }

# openapi3
oaph = { workspace = true, optional = true }

[dev-dependencies]
serde_json = "1"
