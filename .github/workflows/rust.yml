name: tests suite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # to prevent double run on push and pull_request
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    name: clippy&test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c just ci

  publish-demo-image:
    # runs on every push, PR and manual dispatch;
    # the image is pushed to GHCR only outside pull_request builds
    name: publish demo image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build and load image
        run: |
          nix build --impure .#demo-image --out-link /tmp/geosuggest-demo-image
          docker load < /tmp/geosuggest-demo-image
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and publish image
        # do not publish from pull_request builds (GITHUB_SHA is a merge commit
        # and forks have no packages:write token)
        if: github.event_name != 'pull_request'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/geosuggest-demo"
          docker tag geosuggest-demo:latest "$image:latest"
          docker tag geosuggest-demo:latest "$image:sha-${GITHUB_SHA::12}"
          docker push "$image:latest"
          docker push "$image:sha-${GITHUB_SHA::12}"
